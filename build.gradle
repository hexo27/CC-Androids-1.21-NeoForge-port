plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.141'
}

group = 'com.thunderbear06'
version = '1.3.1'

base {
    archivesName = 'cc_androids'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven {
        url 'https://maven.squiddev.cc'
        content {
            includeGroup('cc.tweaked')
        }
    }
}

neoForge {
    version = '21.1.233'

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        cc_androids {
            sourceSet sourceSets.main
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Full CC jar: the mod uses internals (shared.computer, shared.network, shared.recipe)
    // as well as the public API. Same approach as CC-Rideable.
    compileOnly "cc.tweaked:cc-tweaked-1.21.1-forge:${project.cct_version}"
    localRuntime "cc.tweaked:cc-tweaked-1.21.1-forge:${project.cct_version}"
}

def modProps = [
        mod_id     : 'cc_androids',
        mod_version: project.version.toString(),
]

tasks.named('processResources').configure {
    inputs.properties(modProps)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(modProps)
    }
}
